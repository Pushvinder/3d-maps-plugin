name: flutter_3d_map
description: "A cross-platform Flutter plugin for photorealistic 3D maps on Android and iOS with custom markers, flyTo camera animations, and map mode controls."
version: 1.0.4
homepage: https://github.com/Pushvinder/3d-maps-plugin
repository: https://github.com/Pushvinder/3d-maps-plugin

screenshots:
  - description: 'Photorealistic 3D Map view on Android'
    path: doc/screenshots/map_3d_demo_android.png
  - description: 'Photorealistic 3D Map view on iOS'
    path: doc/screenshots/map_3d_demo_ios.png

environment:
  sdk: ^3.12.2
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

false_secrets:
  - /example/android/app/src/main/AndroidManifest.xml

flutter:
  plugin:
    platforms:
      android:
        package: com.app.three_d_map
        pluginClass: ThreeDMapPlugin
      ios:
        pluginClass: ThreeDMapPlugin
